name: Docker Image CI

# Build only when a release tag is pushed. The CCC repository consumes the
# client-* tags from this image; it does not build ccc-fuse-sidecar itself.
on:
  push:
    tags:
      - '**'

env:
  IMAGE_REPOSITORY: vicoslab/ccc-fuse-sidecar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CCC FUSE sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: sidecar
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPOSITORY }}:latest
          cache-to: type=inline
          pull: true

      - name: Build and push CCC FUSE client image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:client-${{ github.ref_name }}
            ${{ env.IMAGE_REPOSITORY }}:client-latest
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPOSITORY }}:client-latest
          cache-to: type=inline
          pull: true
