services:
  fuse-sidecar:
    image: ccc-fuse-sidecar:test-sidecar
    restart: unless-stopped
    network_mode: "none"
    devices:
      - /dev/fuse:/dev/fuse:rw
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - type: bind
        source: ./run
        target: /run/ccc-fuse-sidecar
      - type: bind
        source: ./mnt
        target: /mnt/ccc-fuse
        bind:
          propagation: rshared
    command:
      - --socket
      - /run/ccc-fuse-sidecar/fuse.sock
      - --allow-prefix
      - /mnt/ccc-fuse

  fuse-client:
    depends_on:
      - fuse-sidecar
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CCC_FUSE_CLIENT_IMAGE: ccc-fuse-sidecar:test-client
    restart: "no"
    network_mode: "none"
    devices:
      - /dev/fuse:/dev/fuse:rw
    volumes:
      - type: bind
        source: ./run
        target: /run/ccc-fuse-sidecar
      - type: bind
        source: ./mnt
        target: /mnt/ccc-fuse
        bind:
          propagation: rshared
      - type: bind
        source: ./smoke-archivemount.sh
        target: /usr/local/bin/ccc-fuse-smoke-archivemount
        read_only: true
    command:
      - bash
      - /usr/local/bin/ccc-fuse-smoke-archivemount
